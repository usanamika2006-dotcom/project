{% extends 'base.html' %}{% block title %}My profile{% endblock %}{% block breadcrumb %}My profile{% endblock %}{% block content %}<div class="page-heading"><div><span class="eyebrow">ACCOUNT SETTINGS</span><h1>Your profile<em>.</em></h1><p>Keep your account information current and secure.</p></div></div><section class="panel form-panel" style="max-width:680px"><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Name<input name="name" value="{{ current_user.name }}" required minlength="2"></label><label>Email<input value="{{ current_user.email }}" disabled></label><label>Phone<input name="phone" value="{{ current_user.phone or '' }}"></label><div class="span-2"><hr style="border:0;border-top:1px solid var(--line)"></div><label>Current password <span class="optional">required to change password</span><input name="current_password" type="password" autocomplete="current-password"></label><label>New password <span class="optional">leave blank to keep current</span><input name="new_password" type="password" minlength="10" autocomplete="new-password"></label><button class="button form-submit">Save profile <span>↗</span></button></form></section>{% endblock %}
